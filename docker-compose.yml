services:
  app:
    build: ./app
#    ports:
#      - "8080:8080"
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=Unbr3akable!2026"
      # opdracht 4: OpenFGA is de PDP. Enkel bereikbaar over het interne netwerk authz.
      # Wordt pas gebruikt vanaf stap 4 (sectie "OpenFga" in de configuratie, zoals "Oidc").
      OpenFga__ApiUrl: "http://openfga:8080"
      OpenFga__PresharedKey: ${OPENFGA_PRESHARED_KEY}
    depends_on:
      - db
    restart: unless-stopped
    networks:
        - backend
        - bw-services
        - authz
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: Unbr3akable!2026
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

# opdracht 4: identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # publiek adres: de browser bereikt Keycloak via BunkerWeb op /auth
      KC_HOSTNAME: https://g17.ipv6.thelastgym.be/auth
      # admin console enkel via SSH tunnel, niet via het internet
      KC_HOSTNAME_ADMIN: http://localhost:8081/auth
      KC_HTTP_RELATIVE_PATH: /auth
      # TLS stopt bij BunkerWeb, daarachter is het http
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # opdracht 4: de API haalt de publieke sleutels intern op (http://keycloak:8080).
      # Dan geeft Keycloak ook interne adressen terug; de issuer blijft het publieke adres.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - keycloak-db
    restart: unless-stopped
    networks:
      - keycloak
      - bw-services

# aparte databank voor Keycloak, los van de berichten
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kcdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - keycloak

# opdracht 4: OpenFGA als PDP (wie mag welk bericht lezen of verwijderen).
# NIET publiek: geen ports, niet op bw-services, niet achter BunkerWeb.
# Enkel de app praat ermee, over het interne netwerk authz.
  openfga:
    image: openfga/openfga:v1.23.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      # zonder gebruiker en wachtwoord in de URI: die staan apart hieronder
      OPENFGA_DATASTORE_URI: postgres://openfga-db:5432/openfga?sslmode=disable
      OPENFGA_DATASTORE_USERNAME: openfga
      OPENFGA_DATASTORE_PASSWORD: ${OPENFGA_DB_PASSWORD}
      # elk verzoek moet "Authorization: Bearer <sleutel>" meesturen, anders 401
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY}
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      # het image heeft geen shell en geen curl, wel grpc_health_probe (gRPC-poort 8081)
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - openfga
      - authz

# opdracht 4: maakt of updatet de tabellen van OpenFGA en stopt dan.
# Draait bij elke deploy; is er niets te doen, dan stopt hij meteen.
  openfga-migrate:
    image: openfga/openfga:v1.23.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga-db:5432/openfga?sslmode=disable
      OPENFGA_DATASTORE_USERNAME: openfga
      OPENFGA_DATASTORE_PASSWORD: ${OPENFGA_DB_PASSWORD}
    depends_on:
      openfga-db:
        condition: service_healthy
    restart: "no"
    networks:
      - openfga

# opdracht 4: aparte databank voor OpenFGA, los van de berichten en van Keycloak
  openfga-db:
    image: postgres:17
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD}
    volumes:
      - fgadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - openfga

# de WAF zelf
  bunkerweb:
    image: bunkerity/bunkerweb:1.6.16
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-services

# de WAF scheduler
  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.16
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      BUNKERWEB_INSTANCES: "bunkerweb"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
      SERVER_NAME: "g17.ipv6.thelastgym.be"
      AUTO_LETS_ENCRYPT: "yes"
      USE_LETS_ENCRYPT_STAGING: "no"

      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://app:8080"
      # opdracht 4: /auth naar Keycloak (langste prefix wint, dus / blijft naar de app gaan)
      REVERSE_PROXY_URL_1: "/auth"
      REVERSE_PROXY_HOST_1: "http://keycloak:8080"
      BAD_BEHAVIOR_STATUS_CODES: "400 403 404 405 429 444"
    restart: unless-stopped
    networks:
      - bw-universe

volumes:
  dbdata:
  kcdata:
  fgadata:
  bw-storage:

networks:
  backend:
  keycloak:
  # opdracht 4: internal = geen verkeer naar of van buiten, enkel tussen de containers erop
  openfga:          # openfga <-> openfga-db
    internal: true
  authz:            # app <-> openfga
    internal: true
  bw-services:
  bw-universe:
    ipam:
      config:
        - subnet: 10.20.30.0/24 
        # vast subnet voor whitelist
