# .github/workflows/scan-secrets.yml
# SECRET SCANNING met Gitleaks
# DSOMM: Test and Verification > Static depth for applications > "Test for stored secrets"
#
# Zoekt naar wachtwoorden, API keys en tokens in de VOLLEDIGE git-history.
#
# KRITIEK = elk gevonden geheim.
# Aanvaarde geheimen staan in .gitleaksignore (root van de repo); Gitleaks
# leest dat bestand automatisch. De reden staat in docs/accepted-findings.md.
# Elk ANDER geheim laat de pipeline falen (exit code 1).

name: scan-secrets

on:
  workflow_call:   # wordt enkel aangeroepen door pipeline.yml

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volledige history ophalen

      # GATE: geen continue-on-error meer -> vindt Gitleaks een nieuw geheim, dan wordt de job rood.
      - name: Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            git /repo --redact --verbose \
            --report-format json --report-path /repo/gitleaks.json
          # --redact: toont het geheim NIET in de log (de log van een publieke repo is publiek!)

      - name: Rapport bewaren
        uses: actions/upload-artifact@v4
        if: always()   # ook bewaren als de scan faalt, zodat je kan zien WAT er gevonden is
        with:
          name: secrets-report
          path: gitleaks.json
