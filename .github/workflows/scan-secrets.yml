# .github/workflows/scan-secrets.yml
# SECRET SCANNING met Gitleaks
# DSOMM: Test and Verification > Static depth for applications > "Test for stored secrets"
#
# Zoekt naar wachtwoorden, API keys en tokens in de VOLLEDIGE git-history,
# niet enkel in de huidige code: een geheim dat ooit gecommit en later
# verwijderd werd, blijft leesbaar in oude commits.

name: scan-secrets

on:
  workflow_call:   # wordt enkel aangeroepen door pipeline

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volledige history ophalen (standaard enkel de laatste commit)

      - name: Gitleaks
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            git /repo --redact --verbose \
            --report-format json --report-path /repo/gitleaks.json
          # --redact: toont het geheim NIET in de log (de log van een publieke repo is publiek!)

      - name: Rapport bewaren
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-report
          path: gitleaks.json
