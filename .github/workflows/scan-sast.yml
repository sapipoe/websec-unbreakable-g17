# .github/workflows/scan-sast.yml
# SAST (Static Application Security Testing) met Semgrep
# DSOMM: Test and Verification > Static depth for applications >
#        "Static analysis for important server side components"  -> C# API
#        "Static analysis for important client side components"  -> SPA (wwwroot/js)
#
# KRITIEK = severity ERROR.
# De eerste run vond geen enkele ERROR (enkel 1 WARNING), dus er is niets te
# aanvaarden. Elke nieuwe ERROR laat de pipeline falen.

name: scan-sast

on:
  workflow_call:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rapport maken (alle severities)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --metrics=off \
            --config p/csharp --config p/javascript \
            --exclude app/wwwroot/lib \
            --json --output semgrep.json
          # zonder --error: dit is enkel het rapport, de blokkering gebeurt in de volgende stap

      # GATE: --severity ERROR -> enkel ERROR-regels; --error -> exit code 1 als er iets gevonden wordt
      - name: Controle op kritieke bevindingen
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --metrics=off \
            --config p/csharp --config p/javascript \
            --exclude app/wwwroot/lib \
            --severity ERROR --error

      - name: Rapport bewaren
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: semgrep.json
