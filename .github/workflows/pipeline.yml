# .github/workflows/pipeline.yml
# HOOFDWORKFLOW: dit is de ENIGE workflow met een trigger (on: push).
# Hij roept de drie scans aan als "reusable workflows" (bestanden met on: workflow_call).
#
# Stap 2c: de scans BLOKKEREN bij een nieuwe kritieke bevinding (zie elk scanbestand).
# Stap 3 : hier komt later een deploy-job bij met  needs: [secrets, sca, sast]
#          zodat er enkel uitgerold wordt als ALLE scans geslaagd zijn.

name: pipeline

on:
  push:              # elke push, op elke branch (vereiste van de opdracht)
  pull_request:      # ook PR's controleren (op GitHub-hosted runners)
  workflow_dispatch: # handmatig starten vanuit het Actions-tabblad

# Minimale rechten voor de hele run. Een aangeroepen workflow kan
# NOOIT meer rechten krijgen dan wat hier staat.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    uses: ./.github/workflows/scan-secrets.yml

  sca:
    name: SCA
    uses: ./.github/workflows/scan-sca.yml

  sast:
    name: SAST
    uses: ./.github/workflows/scan-sast.yml

  # (stap 3) deploy:
