# .github/workflows/pipeline.yml
# HOOFDWORKFLOW: dit is de ENIGE workflow met een trigger (on: push).
# Hij roept de drie scans aan als "reusable workflows" (bestanden met on: workflow_call).
#
#          de app automatisch uit op onze server, via de self-hosted runner.

name: pipeline

on:
  push:              # elke push, op elke branch (vereiste van de opdracht)
  pull_request:      # ook PR's controleren (op GitHub-hosted runners)
  workflow_dispatch: # handmatig starten vanuit het Actions-tabblad

# Minimale rechten voor de hele run. Een aangeroepen workflow kan
# NOOIT meer rechten krijgen dan wat hier staat.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    uses: ./.github/workflows/scan-secrets.yml

  sca:
    name: SCA
    uses: ./.github/workflows/scan-sca.yml

  sast:
    name: SAST
    uses: ./.github/workflows/scan-sast.yml

  # ---------------------------------------------------------------
  # DEPLOY naar onze server
  # ---------------------------------------------------------------
  deploy:
    name: Deploy naar server
    # 1. Wacht tot ALLE drie de scans geslaagd zijn. Faalt er één, dan wordt deze job overgeslagen.
    needs: [secrets, sca, sast]
    # 2. Enkel bij een PUSH naar MAIN. Een pull request of een andere branch komt hier nooit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 3. Draait op ONZE self-hosted runner op de server (label g17-deploy), niet bij GitHub.
    #    GitHub kan onze IPv6-only server niet bereiken; de runner belt zelf naar GitHub.
    runs-on: [self-hosted, g17-deploy]
    # 4. Nooit twee deploys tegelijk: een tweede push wacht tot de eerste klaar is.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: App bouwen en starten
        # -p unbreakable: vaste projectnaam, zodat elke deploy dezelfde containers vervangt
        # --build: de image opnieuw bouwen met de nieuwe code
        # -d: op de achtergrond draaien
        run: docker compose -p unbreakable up -d --build --remove-orphans

      - name: Health check (via de WAF)
        # Controleren of de nieuwe versie online staat, via de WAF op ons domein (poort 8080 is dicht).
        # -k: het staging-certificaat is niet vertrouwd (in 5d weghalen)
        # --retry: tot 3 minuten opnieuw proberen, BunkerWeb heeft tijd nodig bij de eerste start
        run: curl -fsS --retry 36 --retry-delay 5 --retry-all-errors https://g17.ipv6.thelastgym.be/health
